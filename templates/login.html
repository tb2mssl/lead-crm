{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
    <h1>Lead pipeline</h1>
    <p>Log in to view and manage your leads.</p>
    {% if notice %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username or email<input name="username" autocomplete="username" autofocus required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <p class="alt"><a href="{{ url_for('forgot') }}">Forgot password?</a></p>
    <p class="alt">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    <p class="alt small"><a href="{{ url_for('admin_login') }}">Admin login</a></p>
{% endblock %}
