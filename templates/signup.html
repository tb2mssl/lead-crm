<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Lead pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth">
  <main class="panel login">
    <h1>Create your account</h1>
    <p>Sign up to start managing leads.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('signup') }}">
      <label>Username<input name="username" value="{{ form.get('username','') }}" autocomplete="username" minlength="3" maxlength="30" autofocus required></label>
      <label>Email<input name="email" type="email" value="{{ form.get('email','') }}" autocomplete="email" required></label>
      <label>Mobile number (optional)<input name="phone" type="tel" value="{{ form.get('phone','') }}" autocomplete="tel"></label>
      <label>Password (min 8 characters)<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Confirm password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="btn primary" type="submit">Sign up</button>
    </form>
    <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </main>
</body>
</html>
